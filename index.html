<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>온기 — 시차를 넘은 연결</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      background: #f6f7fb;
      color: #1f2433;
      min-height: 100vh;
      max-width: 390px;
      margin: 0 auto;
    }

    .screen { display: none; min-height: 100vh; padding-bottom: 40px; }
    .screen.active { display: block; }

    /* 홈 헤더 */
    .home-header {
      padding: 52px 24px 24px;
      background: linear-gradient(160deg, #fff8f0 0%, #f6f7fb 100%);
    }
    .home-header .greeting { font-size: 13px; color: #6b7280; margin-bottom: 4px; }
    .home-header h1 { font-size: 24px; font-weight: 700; }
    .my-time-chip {
      margin-top: 12px;
      display: inline-flex; align-items: center; gap: 6px;
      background: #fff; border-radius: 20px; padding: 6px 14px;
      font-size: 13px; color: #6b7280;
      box-shadow: 0 1px 6px rgba(0,0,0,0.08);
    }
    .pulse {
      width: 8px; height: 8px; border-radius: 50%;
      background: #f59e0b;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    .section-label {
      padding: 22px 24px 10px;
      font-size: 11px; font-weight: 600; color: #6b7280;
      letter-spacing: 0.07em; text-transform: uppercase;
    }

    /* 사람 카드 */
    .person-card {
      margin: 0 16px 10px;
      background: #fff;
      border-radius: 16px;
      padding: 16px 18px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.05);
      display: flex; align-items: center; gap: 14px;
      cursor: pointer;
      transition: transform 0.12s, box-shadow 0.12s;
    }
    .person-card:active { transform: scale(0.975); box-shadow: 0 1px 6px rgba(0,0,0,0.08); }

    .avatar { font-size: 36px; flex-shrink: 0; }

    .person-info { flex: 1; min-width: 0; }
    .person-name { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
    .vibe-tag {
      display: inline-block;
      font-size: 11px; padding: 3px 9px; border-radius: 10px;
    }

    .person-time { text-align: right; flex-shrink: 0; }
    .clock { font-size: 18px; font-weight: 700; }
    .day-label { font-size: 11px; color: #6b7280; margin-top: 2px; }

    /* 공유 버튼 */
    .share-fab {
      margin: 20px 16px 0;
      width: calc(100% - 32px);
      background: linear-gradient(135deg, #ff9f43 0%, #ee5a24 100%);
      color: #fff; border: none; border-radius: 16px;
      padding: 18px 20px;
      font-family: inherit; font-size: 15px; font-weight: 600;
      cursor: pointer;
      display: flex; align-items: center; gap: 14px;
      box-shadow: 0 6px 20px rgba(238,90,36,0.28);
      transition: transform 0.12s;
    }
    .share-fab:active { transform: scale(0.975); }
    .share-fab .fab-icon { font-size: 28px; }
    .share-fab .fab-sub { font-size: 12px; font-weight: 400; opacity: 0.85; margin-top: 3px; display: block; }

    /* 공유 화면 */
    .share-header {
      padding: 52px 24px 20px;
      background: linear-gradient(160deg, #fff8f0 0%, #f6f7fb 100%);
    }
    .back-btn {
      background: none; border: none; font-family: inherit;
      font-size: 13px; color: #6b7280; cursor: pointer;
      display: flex; align-items: center; gap: 4px;
      padding: 0; margin-bottom: 18px;
    }
    .share-header h2 { font-size: 20px; font-weight: 700; line-height: 1.35; }
    .share-header p { font-size: 13px; color: #6b7280; margin-top: 6px; }

    /* 수신자 선택 */
    .recipient-item {
      display: flex; align-items: center; gap: 12px;
      background: #fff; border-radius: 12px; padding: 12px 14px; margin-bottom: 8px;
      border: 2px solid #e5e7eb;
      cursor: pointer; transition: border-color 0.12s;
    }
    .recipient-item.selected { border-color: #4f46e5; }
    .recipient-item .r-avatar { font-size: 26px; }
    .recipient-item .r-name { font-size: 14px; font-weight: 600; }
    .recipient-item .r-ctx { font-size: 11px; color: #6b7280; margin-top: 2px; }
    .recipient-item .r-check { margin-left: auto; color: #4f46e5; font-size: 18px; }

    /* 무드 */
    .field-section { padding: 0 16px 18px; }
    .field-label { font-size: 13px; font-weight: 600; margin-bottom: 10px; }
    .mood-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 7px; }
    .mood-cell {
      background: #fff; border: 2px solid #e5e7eb; border-radius: 12px;
      padding: 10px 4px; text-align: center; cursor: pointer;
      transition: border-color 0.12s, background 0.12s;
    }
    .mood-cell.selected { border-color: #f59e0b; background: #fff8f0; }
    .mood-cell .m-emoji { font-size: 22px; display: block; }
    .mood-cell .m-label { font-size: 10px; color: #6b7280; display: block; margin-top: 3px; }

    /* 메시지 */
    .msg-textarea {
      width: 100%; background: #fff; border: 1.5px solid #e5e7eb;
      border-radius: 14px; padding: 14px 16px;
      font-size: 15px; font-family: inherit; color: #1f2433;
      resize: none; outline: none; line-height: 1.5;
      transition: border-color 0.15s;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }
    .msg-textarea:focus { border-color: #f59e0b; }

    .send-btn {
      margin: 4px 16px 0;
      width: calc(100% - 32px);
      background: #4f46e5; color: #fff;
      border: none; border-radius: 14px;
      padding: 16px; font-size: 16px; font-weight: 600;
      font-family: inherit; cursor: pointer;
      transition: transform 0.12s, opacity 0.12s;
    }
    .send-btn:active { transform: scale(0.975); }

    /* 전송 완료 화면 */
    .sent-wrap {
      padding: 52px 24px 40px;
      display: flex; flex-direction: column; align-items: center;
      background: linear-gradient(180deg, #fff8f0 0%, #f6f7fb 55%);
      min-height: 100vh;
    }
    .sent-back { align-self: flex-start; }
    .sent-icon {
      font-size: 58px; margin: 28px 0 16px;
      animation: float 2.4s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
    .sent-title { font-size: 22px; font-weight: 700; text-align: center; margin-bottom: 8px; }
    .sent-sub { font-size: 14px; color: #6b7280; text-align: center; line-height: 1.65; white-space: pre-line; }

    /* 브릿지 카드 */
    .bridge-card {
      margin: 24px 0 0;
      width: 100%;
      background: #fff;
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
    }
    .bridge-row { display: flex; align-items: center; gap: 10px; }
    .bridge-side { flex: 1; text-align: center; }
    .b-avatar { font-size: 34px; display: block; margin-bottom: 5px; }
    .b-name { font-size: 12px; font-weight: 600; }
    .b-ctx { font-size: 11px; color: #6b7280; margin-top: 3px; line-height: 1.5; white-space: pre-line; }
    .bridge-arrow { font-size: 22px; flex-shrink: 0; }
    .msg-preview {
      margin-top: 16px;
      background: #fff8f0; border-radius: 12px;
      padding: 12px 14px; font-size: 14px; line-height: 1.5;
      border-left: 3px solid #f59e0b;
    }

    /* 반응 영역 */
    .reaction-zone { width: 100%; margin-top: 20px; }
    .waiting-row {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      font-size: 13px; color: #6b7280;
    }
    .dots span {
      display: inline-block; width: 6px; height: 6px;
      background: #6b7280; border-radius: 50%;
      animation: blink 1.2s infinite;
    }
    .dots span:nth-child(2) { animation-delay: 0.2s; }
    .dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes blink {
      0%, 100% { opacity: 0.25; transform: translateY(0); }
      50% { opacity: 1; transform: translateY(-4px); }
    }

    .reaction-card {
      display: none;
      background: #fff; border-radius: 16px;
      padding: 16px 18px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.08);
      animation: slideUp 0.4s ease;
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .reaction-from { font-size: 12px; color: #6b7280; margin-bottom: 8px; }
    .reaction-emoji { font-size: 28px; display: block; margin-bottom: 6px; }
    .reaction-text { font-size: 15px; font-weight: 500; }

    .home-back-btn {
      margin-top: 24px;
      background: none; border: 1.5px solid #e5e7eb;
      border-radius: 12px; padding: 12px 28px;
      font-size: 14px; color: #6b7280; cursor: pointer;
      font-family: inherit;
    }
  </style>
</head>
<body>

<!-- 홈 -->
<div class="screen active" id="s-home">
  <div class="home-header">
    <div class="greeting">안녕하세요 👋</div>
    <h1>나의 사람들</h1>
    <div class="my-time-chip">
      <span class="pulse"></span>
      <span id="my-time"></span>
    </div>
  </div>
  <div class="section-label">지금 이 순간</div>
  <div id="people-list"></div>
  <button class="share-fab" onclick="gotoShare(null)">
    <span class="fab-icon">💌</span>
    <div>
      지금 이 순간 공유하기
      <span class="fab-sub">시차를 넘어 따뜻하게 닿아요</span>
    </div>
  </button>
</div>

<!-- 공유 -->
<div class="screen" id="s-share">
  <div class="share-header">
    <button class="back-btn" onclick="gotoHome()">← 돌아가기</button>
    <h2>지금 이 순간을<br>나눠볼까요?</h2>
    <p>누구에게 보낼지 골라주세요</p>
  </div>
  <div style="padding:0 16px 16px">
    <div class="field-label">받을 사람</div>
    <div id="recipient-list"></div>
  </div>
  <div class="field-section">
    <div class="field-label">지금 기분은?</div>
    <div class="mood-grid" id="mood-grid"></div>
  </div>
  <div class="field-section">
    <div class="field-label">한 줄로 전해요</div>
    <textarea class="msg-textarea" id="msg-input" rows="3"
      placeholder="지금 이 순간을 한 줄로… (예: 오늘 노을이 너무 예뻐서)"></textarea>
  </div>
  <button class="send-btn" onclick="sendMoment()">보내기 💌</button>
</div>

<!-- 전송 완료 -->
<div class="screen" id="s-sent">
  <div class="sent-wrap">
    <button class="back-btn sent-back" onclick="gotoHome()">← 홈으로</button>
    <div class="sent-icon">💌</div>
    <div class="sent-title">시차를 넘어<br>닿았어요</div>
    <div class="sent-sub" id="sent-sub"></div>
    <div class="bridge-card">
      <div class="bridge-row">
        <div class="bridge-side">
          <span class="b-avatar">🧑‍💻</span>
          <div class="b-name">나</div>
          <div class="b-ctx" id="b-me-ctx"></div>
        </div>
        <div class="bridge-arrow">💌</div>
        <div class="bridge-side">
          <span class="b-avatar" id="b-them-avatar"></span>
          <div class="b-name" id="b-them-name"></div>
          <div class="b-ctx" id="b-them-ctx"></div>
        </div>
      </div>
      <div class="msg-preview" id="msg-preview"></div>
    </div>
    <div class="reaction-zone">
      <div class="waiting-row" id="waiting-row">
        <span>반응을 기다리는 중</span>
        <div class="dots"><span></span><span></span><span></span></div>
      </div>
      <div class="reaction-card" id="reaction-card">
        <div class="reaction-from" id="r-from"></div>
        <span class="reaction-emoji" id="r-emoji"></span>
        <div class="reaction-text" id="r-text"></div>
      </div>
    </div>
    <button class="home-back-btn" onclick="gotoHome()">홈으로 돌아가기</button>
  </div>
</div>

<script>
  const PEOPLE = [
    { id:1, name:'엄마', emoji:'👩', tz:'Asia/Seoul',
      reactions:[['❤️','보고싶어 우리 딸~'],['🥺','밥은 잘 챙겨먹고 있어?'],['😊','엄마도 생각하고 있었어']] },
    { id:2, name:'민준', emoji:'🧑', tz:'America/New_York',
      reactions:[['😂','ㅋㅋㅋ 진짜?? 나도 보내줘'],['🔥','오 부러워 거기 좋겠다'],['😴','나 자고 있었는데 깨버렸잖아 ㅋㅋ']] },
    { id:3, name:'지혜', emoji:'👧', tz:'Asia/Tokyo',
      reactions:[['🥺','나도 거기 가고싶다…'],['✨','완전 좋겠다 부러워'],['💛','나중에 같이 가자 꼭']] },
  ];

  const MOODS = [
    { emoji:'😊', label:'설렘' },
    { emoji:'🥱', label:'나른함' },
    { emoji:'🌅', label:'감성' },
    { emoji:'😔', label:'외로움' },
    { emoji:'🎉', label:'신남' },
  ];

  let selPerson = null;
  let selMood = null;

  function localTime(tz) {
    return new Date().toLocaleString('ko-KR', { timeZone: tz, hour:'2-digit', minute:'2-digit', hour12:false });
  }
  function localDay(tz) {
    const map = {'일요일':'일','월요일':'월','화요일':'화','수요일':'수','목요일':'목','금요일':'금','토요일':'토'};
    const d = new Date().toLocaleDateString('ko-KR', { timeZone: tz, weekday:'long' });
    return (map[d] || d) + '요일';
  }
  function vibe(tz) {
    const h = parseInt(new Date().toLocaleString('en-US', { timeZone: tz, hour:'numeric', hour12:false }));
    const w = new Date().toLocaleDateString('en-US', { timeZone: tz, weekday:'short' });
    if (h >= 23 || h < 5) return { text:'깊은 밤 🌙', bg:'#ede9fe' };
    if (h >= 5 && h < 8) return { text:'이른 아침 ☀️', bg:'#fef9c3' };
    if (w === 'Mon' && h >= 8 && h < 10) return { text:'출근길 🚇', bg:'#fef3c7' };
    if (h >= 12 && h < 14) return { text:'점심 시간 🍱', bg:'#dcfce7' };
    if (h >= 17 && h < 20) return { text:'저녁 시간 🌆', bg:'#fee2e2' };
    if (w === 'Fri' || w === 'Sat') return { text:'주말 기분 🎉', bg:'#fce7f3' };
    return { text:'평범한 하루 ☕', bg:'#f3f4f6' };
  }
  function myTz() { return Intl.DateTimeFormat().resolvedOptions().timeZone; }

  function renderHome() {
    document.getElementById('my-time').textContent =
      localTime(myTz()) + ' · ' + localDay(myTz());
    document.getElementById('people-list').innerHTML = PEOPLE.map(p => {
      const v = vibe(p.tz);
      return `<div class="person-card" onclick="gotoShare(${p.id})">
        <span class="avatar">${p.emoji}</span>
        <div class="person-info">
          <div class="person-name">${p.name}</div>
          <span class="vibe-tag" style="background:${v.bg}">${v.text}</span>
        </div>
        <div class="person-time">
          <div class="clock">${localTime(p.tz)}</div>
          <div class="day-label">${localDay(p.tz)}</div>
        </div>
      </div>`;
    }).join('');
  }

  function renderShare() {
    document.getElementById('recipient-list').innerHTML = PEOPLE.map(p => {
      const v = vibe(p.tz);
      const sel = selPerson && selPerson.id === p.id;
      return `<div class="recipient-item ${sel?'selected':''}" onclick="pickPerson(${p.id})">
        <span class="r-avatar">${p.emoji}</span>
        <div>
          <div class="r-name">${p.name}</div>
          <div class="r-ctx">${localTime(p.tz)} · ${v.text}</div>
        </div>
        ${sel ? '<span class="r-check">✓</span>' : ''}
      </div>`;
    }).join('');
    document.getElementById('mood-grid').innerHTML = MOODS.map((m,i) =>
      `<div class="mood-cell ${selMood===i?'selected':''}" onclick="pickMood(${i})">
        <span class="m-emoji">${m.emoji}</span>
        <span class="m-label">${m.label}</span>
      </div>`
    ).join('');
  }

  function pickPerson(id) { selPerson = PEOPLE.find(p=>p.id===id); renderShare(); }
  function pickMood(i) { selMood = i; renderShare(); }

  function sendMoment() {
    const msg = document.getElementById('msg-input').value.trim();
    if (!selPerson) { alert('받을 사람을 선택해주세요'); return; }
    if (!msg) { alert('한 줄 메시지를 적어주세요'); return; }

    const moodStr = selMood !== null ? MOODS[selMood].emoji + '  ' : '';
    const v = vibe(selPerson.tz);

    document.getElementById('sent-sub').textContent =
      selPerson.name + '은(는) 지금 ' + v.text + '이에요.\n그래도, 따뜻하게 닿았어요.';
    document.getElementById('b-me-ctx').textContent =
      localTime(myTz()) + '\n' + localDay(myTz());
    document.getElementById('b-them-avatar').textContent = selPerson.emoji;
    document.getElementById('b-them-name').textContent = selPerson.name;
    document.getElementById('b-them-ctx').textContent =
      localTime(selPerson.tz) + '\n' + localDay(selPerson.tz) + '\n' + v.text;
    document.getElementById('msg-preview').textContent = moodStr + msg;

    document.getElementById('waiting-row').style.display = 'flex';
    document.getElementById('reaction-card').style.display = 'none';

    showScreen('s-sent');

    const reactions = selPerson.reactions;
    const pick = reactions[Math.floor(Math.random() * reactions.length)];
    setTimeout(function() {
      document.getElementById('waiting-row').style.display = 'none';
      document.getElementById('r-from').textContent = selPerson.name + '이(가) 반응했어요';
      document.getElementById('r-emoji').textContent = pick[0];
      document.getElementById('r-text').textContent = pick[1];
      document.getElementById('reaction-card').style.display = 'block';
    }, 3000);
  }

  function showScreen(id) {
    document.querySelectorAll('.screen').forEach(function(s) { s.classList.remove('active'); });
    document.getElementById(id).classList.add('active');
    window.scrollTo(0, 0);
  }
  function gotoHome() {
    selPerson = null; selMood = null;
    document.getElementById('msg-input').value = '';
    renderHome();
    showScreen('s-home');
  }
  function gotoShare(personId) {
    if (personId) selPerson = PEOPLE.find(function(p) { return p.id === personId; });
    renderShare();
    showScreen('s-share');
  }

  renderHome();
  setInterval(renderHome, 30000);
</script>
</body>
</html>
