<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>FeeLog</title>
<style>
:root {
  --bg:#f6f7fb;--card:#fff;--accent:#4f46e5;--accent-soft:#ede9fe;
  --text:#1f2433;--sub:#6b7280;--border:#e5e7eb;
  --warm1:#fef3c7;--warm2:#fde68a;--radius:16px;--shadow:0 2px 16px rgba(0,0,0,.07);
}
[data-theme="dark"]{
  --bg:#111827;--card:#1f2937;--text:#f9fafb;--sub:#9ca3af;
  --border:#374151;--accent-soft:#312e81;--warm1:#292524;--warm2:#44403c;
}
*{box-sizing:border-box;margin:0;padding:0}
html{height:100%;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  background:var(--bg);color:var(--text);transition:background .3s,color .3s;
  max-width:430px;margin:0 auto;height:100%;overflow:hidden;display:flex;flex-direction:column}

/* Header */
.header{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 12px;
  flex-shrink:0;background:var(--bg);z-index:10;border-bottom:1px solid var(--border)}
.header h1{font-size:17px;font-weight:700}
.header-right{display:flex;gap:8px;align-items:center}
.theme-btn{background:var(--card);border:1px solid var(--border);border-radius:50%;
  width:34px;height:34px;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;color:var(--text)}

/* Lang toggle */
.lang-toggle{display:flex;background:var(--card);border:1px solid var(--border);
  border-radius:20px;padding:3px;gap:0}
.lang-btn{padding:4px 10px;border-radius:16px;font-size:11px;font-weight:800;
  font-family:inherit;border:none;cursor:pointer;background:none;color:var(--sub);transition:all .18s;line-height:1}
.lang-btn.active{background:var(--accent);color:#fff;box-shadow:0 2px 6px rgba(79,70,229,.3)}

/* Back button */
.back-btn{background:none;border:none;color:var(--accent);font-size:14px;font-weight:700;
  cursor:pointer;font-family:inherit;padding:4px 8px 4px 0;display:flex;align-items:center;gap:4px}

/* Main */
.main{padding:14px 16px 20px;max-width:480px;margin:0 auto;flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.section-title{font-size:13px;font-weight:600;color:var(--sub);margin-bottom:10px;
  display:flex;align-items:center;gap:6px}

/* ── Friend list (home) ── */
.friend-list-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:14px 16px;margin-bottom:10px;display:flex;align-items:center;gap:14px;
  cursor:pointer;box-shadow:var(--shadow);transition:transform .15s}
.friend-list-card:hover{transform:translateY(-1px)}
.fcard-avatar{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;font-size:26px;flex-shrink:0}
.fcard-info{flex:1;min-width:0}
.fcard-name{font-size:15px;font-weight:700;margin-bottom:2px}
.fcard-sub{font-size:12px;color:var(--sub);display:flex;align-items:center;gap:6px}
.fcard-time{font-size:12px;font-weight:600}
.dot-live{width:6px;height:6px;background:#22c55e;border-radius:50%;
  animation:pulse 2s infinite;flex-shrink:0}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.8)}}
.city-badge{background:var(--accent-soft);color:var(--accent);
  padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600}
.fcard-emotion{font-size:28px}

/* ── Room view ── */
.room-friend-card{background:linear-gradient(135deg,#667eea22,#764ba222);
  border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:14px}
.friend-label{font-size:11px;font-weight:600;color:var(--sub);text-transform:uppercase;
  letter-spacing:.8px;margin-bottom:8px}
.friend-main{display:flex;align-items:center;gap:12px}
.friend-emoji-big{font-size:42px;line-height:1;transition:all .4s cubic-bezier(.34,1.56,.64,1)}
.friend-info{flex:1}
.friend-name{font-size:16px;font-weight:700;margin-bottom:3px}
.friend-status{font-size:13px;color:var(--sub);margin-bottom:5px}
.friend-time{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--sub)}
.friend-when{font-size:11px;color:var(--sub);margin-top:7px}

/* Friends row (horizontal scroll) */
.friends-row-wrap{overflow-x:auto;margin:0 -16px;padding:0 16px 12px;scrollbar-width:none}
.friends-row-wrap::-webkit-scrollbar{display:none}
.friends-row{display:flex;gap:10px;width:max-content}
.friend-bubble{display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;min-width:58px}
.friend-bubble-avatar{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;font-size:26px;border:2.5px solid var(--border);position:relative;transition:border-color .2s}
.friend-bubble-avatar.active-friend{border-color:var(--accent)}
.friend-bubble-name{font-size:11px;font-weight:600;color:var(--sub)}
.friend-bubble-time{font-size:10px;color:var(--sub)}

/* My status bar */
.my-status-bar{display:flex;align-items:center;gap:12px;padding:12px 14px;
  background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  margin-bottom:12px;box-shadow:var(--shadow)}

/* Share sheet */
.share-targets{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.share-target-btn{display:flex;align-items:center;gap:6px;padding:8px 12px;
  border-radius:40px;border:2px solid var(--border);background:var(--bg);
  cursor:pointer;font-size:13px;font-weight:600;font-family:inherit;
  color:var(--sub);transition:all .15s}
.share-target-btn.selected{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.share-target-btn .st-emoji{font-size:18px}
.share-send-btn{width:100%;padding:12px;border-radius:12px;border:none;
  background:var(--accent);color:#fff;font-size:14px;font-weight:700;
  cursor:pointer;font-family:inherit;transition:opacity .2s}
.share-send-btn:hover{opacity:.88}
.share-send-btn:disabled{opacity:.4;cursor:default}

/* Check-in */
.checkin-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
.my-current{display:flex;align-items:center;gap:12px;margin-bottom:14px;
  padding-bottom:12px;border-bottom:1px solid var(--border)}
.my-emoji-display{font-size:34px;transition:all .4s cubic-bezier(.34,1.56,.64,1)}
.my-status-text{flex:1}
.my-status-text strong{font-size:14px;display:block;margin-bottom:2px}
.my-status-text span{font-size:12px;color:var(--sub)}
.my-city{font-size:11px;color:var(--accent);font-weight:600;background:var(--accent-soft);
  padding:3px 9px;border-radius:10px}
.emoji-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.emoji-btn{aspect-ratio:1;background:var(--bg);border:2px solid transparent;
  border-radius:12px;font-size:21px;cursor:pointer;display:flex;flex-direction:column;
  align-items:center;justify-content:center;transition:all .15s;position:relative;padding:5px 2px 3px}
.emoji-btn span.label{font-size:8px;color:var(--sub);margin-top:2px;text-align:center;line-height:1.1}
.emoji-btn:hover{transform:scale(1.1);background:var(--accent-soft)}
.emoji-btn.selected{border-color:var(--accent);background:var(--accent-soft)}
.emoji-btn.selected::after{content:'✓';position:absolute;top:-4px;right:-4px;background:var(--accent);
  color:#fff;width:14px;height:14px;border-radius:50%;font-size:9px;
  display:flex;align-items:center;justify-content:center}

/* Capsule */
.capsule-card{background:linear-gradient(135deg,var(--warm1),var(--warm2));
  border:1px solid #fcd34d44;border-radius:var(--radius);padding:14px;margin-bottom:14px}
.capsule-title{font-size:13px;font-weight:700;margin-bottom:3px}
.capsule-desc{font-size:12px;color:var(--sub);margin-bottom:10px}
.capsule-presets{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:4px}
.preset-btn{padding:5px 10px;border-radius:20px;border:1.5px solid var(--border);
  background:var(--card);color:var(--sub);font-size:11px;font-weight:600;
  cursor:pointer;font-family:inherit;transition:all .15s}
.preset-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.capsule-row{display:flex;gap:8px;align-items:center;margin-top:8px}
.capsule-input{flex:1;border:1px solid var(--border);border-radius:10px;padding:8px 12px;
  font-size:13px;background:var(--card);color:var(--text);outline:none;font-family:inherit}
.capsule-input:focus{border-color:var(--accent)}
.capsule-btn{background:var(--accent);color:#fff;border:none;border-radius:10px;
  padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;font-family:inherit}
.capsule-preview{font-size:11px;color:var(--accent);font-weight:600;margin-top:6px}
.capsule-saved{font-size:12px;color:#059669;margin-top:6px;min-height:18px}
.capsule-custom-time{margin-top:6px;display:none}

/* ── Timeline ── */
.tl-top-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.tz-toggle{display:flex;background:var(--card);border:1px solid var(--border);
  border-radius:20px;overflow:hidden}
.tz-btn{padding:5px 10px;border:none;background:transparent;color:var(--sub);cursor:pointer;
  font-size:11px;font-family:inherit;font-weight:600;transition:all .2s;white-space:nowrap}
.tz-btn.active{background:var(--accent);color:#fff}
.friend-filter-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.filter-chip{padding:5px 12px;border-radius:20px;border:1.5px solid var(--border);
  background:var(--card);color:var(--sub);font-size:12px;font-weight:600;cursor:pointer;font-family:inherit}
.filter-chip.active{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.tz-desc{font-size:12px;color:var(--sub);margin-bottom:10px;padding:7px 12px;
  background:var(--card);border:1px solid var(--border);border-radius:10px;line-height:1.5}
.tz-desc strong{color:var(--text)}
.journey-legend{display:flex;align-items:center;gap:6px;flex-wrap:wrap;
  margin-bottom:10px;font-size:12px;font-weight:600;color:var(--sub)}
.legend-dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.legend-label{color:var(--text)}
.overlap-banner{background:linear-gradient(135deg,var(--accent-soft),#fef3c7);
  border:1px solid #c4b5fd44;border-radius:12px;padding:10px 14px;margin-bottom:10px;font-size:13px}
.overlap-banner strong{display:block;margin-bottom:2px}
.overlap-banner span{font-size:11px;color:var(--sub)}
.journey-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:12px 10px 6px 6px;box-shadow:var(--shadow);display:flex;gap:6px;margin-bottom:4px}
.journey-y-labels{display:flex;flex-direction:column;justify-content:space-between;
  font-size:9px;color:var(--sub);padding:2px 0;min-width:38px;text-align:right;line-height:1.3}
.journey-chart-wrap{flex:1}
#journeySvg{display:block;width:100%;overflow:visible}
.journey-x-labels{display:flex;justify-content:space-between;padding:4px 8px 0 52px;
  font-size:10px;color:var(--sub);margin-bottom:14px}

/* Event list + reactions */
.ev-item{background:var(--card);border:1px solid var(--border);border-radius:12px;
  padding:10px 12px;margin-bottom:8px}
.ev-top{display:flex;align-items:center;gap:10px}
.ev-emoji{font-size:20px}
.ev-info{flex:1}
.ev-badge{font-size:10px;font-weight:700;padding:2px 7px;border-radius:8px;
  display:inline-block;margin-bottom:2px}
.ev-text{font-size:12px;color:var(--sub)}
.ev-time-label{font-size:11px;color:var(--sub)}
.reaction-row{display:flex;align-items:center;gap:4px;margin-top:8px;flex-wrap:wrap}
.react-btn{background:var(--bg);border:1px solid var(--border);border-radius:20px;
  padding:3px 8px;font-size:12px;cursor:pointer;font-family:inherit;transition:all .15s;
  display:flex;align-items:center;gap:3px;color:var(--sub)}
.react-btn:hover{border-color:var(--accent);background:var(--accent-soft)}
.react-btn.mine{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600}
.react-count{font-size:11px}
.add-react{background:var(--bg);border:1px dashed var(--border);border-radius:20px;
  padding:3px 8px;font-size:13px;cursor:pointer;color:var(--sub);transition:all .15s}
.add-react:hover{border-color:var(--accent)}
.react-picker{display:none;gap:4px;flex-wrap:wrap}
.react-picker.open{display:flex}
.react-option{font-size:18px;cursor:pointer;padding:2px;border-radius:8px;transition:transform .15s}
.react-option:hover{transform:scale(1.3)}

/* Capsule list */
.capsule-item{display:flex;align-items:center;gap:10px;background:var(--card);
  border:1px solid var(--border);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.ci-emoji{font-size:20px}
.ci-text{flex:1}
.ci-when{font-size:11px;color:var(--sub)}
.capsule-status{font-size:11px;padding:2px 8px;border-radius:8px;font-weight:600}
.status-pending{background:var(--warm1);color:#92400e}
.status-delivered{background:#d1fae5;color:#065f46}

/* Bottom tabs */
.bottom-tabs{flex-shrink:0;background:var(--card);
  border-top:1px solid var(--border);display:flex;padding:8px 0 20px;z-index:20}
.tab-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
  background:none;border:none;cursor:pointer;color:var(--sub);font-size:10px;
  font-family:inherit;padding:6px 0;transition:color .2s}
.tab-btn .tab-icon{font-size:20px}
.tab-btn.active{color:var(--accent)}

/* Toast */
.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%) translateY(-20px);
  background:var(--text);color:var(--bg);padding:10px 18px;border-radius:20px;
  font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:all .3s;
  z-index:100;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.page{display:none}
.page.active{display:block}

/* ── Overlay panels (DM / AI chat) ── */
.overlay-panel{position:fixed;inset:0;background:var(--bg);z-index:50;display:none;flex-direction:column}
.overlay-panel.open{display:flex}
.overlay-header{display:flex;align-items:center;gap:10px;padding:14px 16px;
  border-bottom:1px solid var(--border);background:var(--card);flex-shrink:0}
.overlay-back{background:none;border:none;font-size:20px;cursor:pointer;color:var(--accent);padding:2px 6px 2px 0}
.overlay-title{font-size:15px;font-weight:700;flex:1}
.overlay-badge{font-size:10px;font-weight:700;padding:3px 8px;border-radius:10px}
.badge-ai{background:#fef3c7;color:#92400e}
.badge-dm{background:var(--accent-soft);color:var(--accent)}

/* Chat messages */
.chat-body{flex:1;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.chat-anchor{background:var(--accent-soft);border-radius:12px;padding:10px 14px;
  margin-bottom:4px;font-size:13px;border-left:3px solid var(--accent)}
.chat-anchor-label{font-size:10px;color:var(--accent);font-weight:700;margin-bottom:3px}
.bubble-row{display:flex;align-items:flex-end;gap:8px}
.bubble-row.me{flex-direction:row-reverse}
.bubble-avatar{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;font-size:16px;flex-shrink:0}
.bubble{max-width:72%;padding:10px 14px;border-radius:18px;font-size:14px;line-height:1.5;word-break:break-word}
.bubble.them{background:var(--card);border:1px solid var(--border);border-bottom-left-radius:4px}
.bubble.me{background:var(--accent);color:#fff;border-bottom-right-radius:4px}
.bubble-time{font-size:10px;color:var(--sub);margin-bottom:2px}
.typing-bubble{display:flex;gap:5px;padding:12px 16px;background:var(--card);
  border:1px solid var(--border);border-radius:18px;border-bottom-left-radius:4px;
  width:fit-content}
.typing-dot{width:7px;height:7px;border-radius:50%;background:var(--sub);
  animation:typingDot 1.2s infinite}
.typing-dot:nth-child(2){animation-delay:.2s}
.typing-dot:nth-child(3){animation-delay:.4s}
@keyframes typingDot{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-6px)}}

/* Chat input */
.chat-input-bar{display:flex;gap:8px;padding:10px 14px;border-top:1px solid var(--border);
  background:var(--card);flex-shrink:0}
.chat-input{flex:1;border:1px solid var(--border);border-radius:22px;padding:9px 16px;
  font-size:14px;background:var(--bg);color:var(--text);outline:none;font-family:inherit}
.chat-input:focus{border-color:var(--accent)}
.chat-send{background:var(--accent);color:#fff;border:none;border-radius:50%;
  width:38px;height:38px;font-size:18px;cursor:pointer;flex-shrink:0;display:flex;
  align-items:center;justify-content:center}

/* AI upload zone */
.ai-upload-zone{margin:12px 16px;border:2px dashed var(--border);border-radius:14px;
  padding:16px;text-align:center;cursor:pointer;transition:border-color .2s}
.ai-upload-zone:hover{border-color:var(--accent)}
.ai-notice{margin:0 16px 10px;background:var(--warm1);border-radius:10px;
  padding:10px 14px;font-size:12px;color:var(--sub);line-height:1.5}
</style>
</head>
<body>
<div class="toast" id="toast"></div>

<div class="header">
  <div style="display:flex;align-items:center;gap:8px">
    <svg width="108" height="34" viewBox="0 0 108 34" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="FeeLog">
      <defs>
        <linearGradient id="fl1" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#6366f1"/>
          <stop offset="100%" stop-color="#a78bfa"/>
        </linearGradient>
        <linearGradient id="fl2" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#4f46e5"/>
          <stop offset="100%" stop-color="#7c3aed"/>
        </linearGradient>
      </defs>
      <!-- 아이콘 배경 -->
      <rect x="0" y="1" width="32" height="32" rx="10" fill="url(#fl1)"/>
      <!-- 지구 원 -->
      <circle cx="16" cy="17" r="8" fill="none" stroke="white" stroke-width="1.5" opacity="0.9"/>
      <!-- 지구 세로선 -->
      <ellipse cx="16" cy="17" rx="3.5" ry="8" fill="none" stroke="white" stroke-width="1.2" opacity="0.7"/>
      <!-- 지구 가로선 -->
      <line x1="8" y1="17" x2="24" y2="17" stroke="white" stroke-width="1.2" opacity="0.7"/>
      <line x1="9" y1="13" x2="23" y2="13" stroke="white" stroke-width="1" opacity="0.5"/>
      <line x1="9" y1="21" x2="23" y2="21" stroke="white" stroke-width="1" opacity="0.5"/>
      <!-- 하트 핀 -->
      <path d="M16 10c-1.1 0-2 .9-2 2 0 1.5 2 3.5 2 3.5s2-2 2-3.5c0-1.1-.9-2-2-2z" fill="#fbbf24"/>
      <!-- Fee 텍스트 -->
      <text x="37" y="15" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-weight="800" font-size="14" fill="url(#fl2)" letter-spacing="-0.3">Fee</text>
      <!-- Log 텍스트 -->
      <text x="62" y="15" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-weight="800" font-size="14" fill="var(--text)" letter-spacing="-0.3">Log</text>
      <!-- 서브 태그라인 -->
      <text x="37" y="27" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-weight="600" font-size="8" fill="var(--sub)" id="logoTagline">감정을 시간으로 잇다</text>
    </svg>
  </div>
  <div class="header-right" style="display:flex;align-items:center;gap:8px">
    <div class="lang-toggle">
      <button class="lang-btn active" id="btn-kor" onclick="setLang('ko')">KOR</button>
      <button class="lang-btn" id="btn-eng" onclick="setLang('en')">ENG</button>
    </div>
    <button class="theme-btn" onclick="toggleTheme()">🌙</button>
  </div>
</div>

<div class="main">

  <!-- ── 홈 탭 ── -->
  <div class="page active" id="page-home">

    <!-- 친구 상태 가로 스크롤 -->
    <div class="friends-row-wrap">
      <div class="friends-row" id="friendsRow"></div>
    </div>

    <!-- 내 현재 상태 -->
    <div class="my-status-bar">
      <div class="my-emoji-display" id="myEmojiDisplay">😊</div>
      <div class="my-status-text">
        <strong id="myStatusLabel">행복해요</strong>
        <span id="myCheckinTime">방금 전 체크인</span>
      </div>
      <span class="my-city" id="myCity">서울</span>
    </div>

    <!-- 감정 그리드 -->
    <div class="checkin-card">
      <div class="emoji-grid" id="emojiGrid"></div>

  return new Date(now.getTime() + now.getTimezoneOffset()*60000 + offset*3600000);
}
function fmt(date) { return date.toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit',hour12:false}); }
function relTime(ts) {
  const S = STRINGS[lang];
  const d = Math.floor((Date.now()-ts)/1000);
  if(d<60) return S.relNow;
  if(d<3600) return S.relMin(Math.floor(d/60));
  if(d<86400) return S.relHr(Math.floor(d/3600));
  return S.relOld;
}
function fmtTs(ts) {
  return new Date(ts).toLocaleString('ko-KR',{month:'long',day:'numeric',weekday:'short',hour:'2-digit',minute:'2-digit'});
}
function nextOccurrence(h,m){const d=new Date();d.setSeconds(0,0);d.setHours(h,m);if(d<=Date.now())d.setDate(d.getDate()+1);return d.getTime();}
function nextWeekday(dow,h,m){const d=new Date();d.setSeconds(0,0);d.setHours(h,m);const diff=(dow-d.getDay()+7)%7||7;d.setDate(d.getDate()+diff);return d.getTime();}

// ── Journey SVG ───────────────────────────────────────────
function drawJourneySvg(myPts, friendPtsMap, activeFriends) {
  const svg = document.getElementById('journeySvg');
  const W=600,H=240,PT=22,PB=22,PL=4,PR=16,cW=W-PL-PR,cH=H-PT-PB;

  const tzDiff = (f) => tzMode==='real' ? (ME.offset - f.offset) : 0;
  function toH(timeStr, friendOffset) {
    if(!timeStr) return null;
    const [h,m]=timeStr.split(':').map(Number);
    return h + m/60 + (friendOffset||0);
  }

  const allH = [
    ...myPts.map(p=>toH(p.timeStr,0)),
    ...activeFriends.flatMap(f=>(friendPtsMap[f.id]||[]).map(p=>toH(p.timeStr, tzDiff(f)))),
  ].filter(h=>h!==null);
  const minH = allH.length ? Math.max(0,Math.min(...allH)-1) : 6;
  const maxH2 = allH.length ? Math.min(30,Math.max(...allH)+1) : 22;
  const rangeH = Math.max(maxH2-minH,8);

  function xOf(h){return PL+((h-minH)/rangeH)*cW;}
  function yOf(emoji){const s=EMOTION_SCORE[emoji]??5;return PT+cH-((s-1)/9)*cH;}

  // X labels
  const labels=[];
  for(let i=0;i<=6;i++){const h=Math.round(minH+(i/6)*rangeH)%24;labels.push(`${String(h).padStart(2,'0')}:00`);}
  const xNote = tzMode==='real' ? s('xNote') : '';
  document.getElementById('journeyXLabels').innerHTML=labels.map(l=>`<span>${l}</span>`).join('')+xNote;

  function curve(pts, offsetH) {
    const valid = pts.map(p=>({x:xOf(toH(p.timeStr,offsetH)),y:yOf(p.emoji),emoji:p.emoji})).filter(p=>p.x!==null);
    if(!valid.length) return {d:null,pts:valid};
    let d=`M${valid[0].x} ${valid[0].y}`;
    for(let i=1;i<valid.length;i++){const cx=(valid[i-1].x+valid[i].x)/2;d+=` C${cx} ${valid[i-1].y} ${cx} ${valid[i].y} ${valid[i].x} ${valid[i].y}`;}
    return {d,pts:valid};
  }
  function area(pts,color){
    if(!pts.length) return '';
    const bot=PT+cH;
    let d=`M${pts[0].x} ${bot} L${pts[0].x} ${pts[0].y}`;
    for(let i=1;i<pts.length;i++){const cx=(pts[i-1].x+pts[i].x)/2;d+=` C${cx} ${pts[i-1].y} ${cx} ${pts[i].y} ${pts[i].x} ${pts[i].y}`;}
    d+=` L${pts[pts.length-1].x} ${bot} Z`;
    return `<path d="${d}" fill="${color}" opacity="0.08"/>`;
  }
  function dots(pts,color){
    return pts.map(p=>`
      <circle cx="${p.x}" cy="${p.y}" r="5" fill="${color}" stroke="white" stroke-width="2.5"/>
      <text x="${p.x}" y="${p.y-10}" text-anchor="middle" font-size="15" style="user-select:none">${p.emoji}</text>`).join('');
  }

  // Grid
  let grid='';
  for(let i=1;i<=4;i++){const y=PT+(i/5)*cH;grid+=`<line x1="${PL}" y1="${y}" x2="${W-PR}" y2="${y}" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="4,4"/>`;}

  // Overlap (me vs first active friend)
  let overlapRect='';
  if(activeFriends.length===1){
    const f=activeFriends[0];
    const myHs=myPts.map(p=>toH(p.timeStr,0)).filter(Boolean);
    const frHs=(friendPtsMap[f.id]||[]).map(p=>toH(p.timeStr,tzDiff(f))).filter(Boolean);
    if(myHs.length&&frHs.length){
      const s=Math.max(Math.min(...myHs),Math.min(...frHs));
      const e2=Math.min(Math.max(...myHs),Math.max(...frHs));
      if(e2>s){
        overlapRect=`<rect x="${xOf(s)}" y="${PT}" width="${xOf(e2)-xOf(s)}" height="${cH}" fill="#a78bfa" opacity="0.07" rx="4"/>
          <rect x="${xOf(s)}" y="${PT-4}" width="${xOf(e2)-xOf(s)}" height="5" rx="3" fill="#a78bfa" opacity="0.4"/>`;
        const banner=document.getElementById('overlapBanner');
        banner.style.display='block';
        banner.querySelector('strong').textContent=STRINGS[lang].overlapStrong;
        banner.querySelector('span').textContent=STRINGS[lang].overlapSpan(s,e2);
      }
    } else { document.getElementById('overlapBanner').style.display='none'; }
  } else { document.getElementById('overlapBanner').style.display='none'; }

  const myCurve = curve(myPts,0);
  let svgContent = grid + overlapRect + area(myCurve.pts, ME.color);
  activeFriends.forEach(f=>{
    const fc=curve(friendPtsMap[f.id]||[],tzDiff(f));
    svgContent+=area(fc.pts,f.color);
    if(fc.d) svgContent+=`<path d="${fc.d}" fill="none" stroke="${f.color}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7,3"/>`;
    svgContent+=dots(fc.pts,f.color);
  });
  if(myCurve.d) svgContent+=`<path d="${myCurve.d}" fill="none" stroke="${ME.color}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>`;
  svgContent+=dots(myCurve.pts,ME.color);
  if(!myPts.length&&!activeFriends.some(f=>(friendPtsMap[f.id]||[]).length))
    svgContent+=`<text x="${W/2}" y="${H/2}" text-anchor="middle" fill="#9ca3af" font-size="13">${s('svgEmpty')}</text>`;
  svg.innerHTML=svgContent;
}

let dmFriend = null;
let dmAnchorItem = null;
let dmMessages = [];

function openDM(item) {
  const f = FRIENDS.find(f => f.id === item.user) || FRIENDS[0];
  dmFriend = f;
  dmAnchorItem = item;
  dmMessages = gs(`dm_${f.id}`) || [];

  document.getElementById('dmTitle').textContent = `${f.name}과의 대화`;
  renderDMBody();
  document.getElementById('dmPanel').classList.add('open');
  setTimeout(() => {
    const b = document.getElementById('dmBody');
    b.scrollTop = b.scrollHeight;
    document.getElementById('dmInput').focus();
  }, 100);
}

function renderDMBody() {
  const body = document.getElementById('dmBody');
  const f = dmFriend;
  const item = dmAnchorItem;

  const anchorHtml = item ? `
    <div class="chat-anchor">
      <div class="chat-anchor-label">💬 이 순간에 대해 이야기해요</div>
      <span style="font-size:20px">${item.emoji}</span>
      <strong>${item.comment || item.text}</strong>
      <span style="font-size:11px;color:var(--sub)"> · ${item.timeStr}</span>
    </div>` : '';

  const msgs = dmMessages.map(m => {
    const isMe = m.from === 'me';
    return `<div class="bubble-row ${isMe ? 'me' : ''}">
      ${!isMe ? `<div class="bubble-avatar" style="background:${f.color}22">${gs(`emotion_${f.id}`)?.emoji||'😊'}</div>` : ''}
      <div>
        ${!isMe ? `<div class="bubble-time">${f.name}</div>` : ''}
        <div class="bubble ${isMe ? 'me' : 'them'}">${m.text}</div>
      </div>
    </div>`;
  }).join('');

  body.innerHTML = anchorHtml + msgs;
  body.scrollTop = body.scrollHeight;
}

function sendDM() {
  const input = document.getElementById('dmInput');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  dmMessages.push({ from: 'me', text, ts: Date.now() });
  ss(`dm_${dmFriend.id}`, dmMessages);
  renderDMBody();
}

function openAIChat(friendId) {
  aiFriend = FRIENDS.find(f => f.id === friendId);
  aiMessages = gs(`ai_${friendId}`) || [];

  document.getElementById('aiTitle').textContent = `${aiFriend.name} AI`;
  document.getElementById('aiNotice').innerHTML =
    `🧠 <strong>${aiFriend.name}의 말투를 학습했어요</strong><br>카톡 대화 로그를 올리면 더 정확하게 재현할 수 있어요`;

  // 첫 진입이면 인사 메시지
  if (aiMessages.length === 0) {
    const p = AI_PERSONAS[aiFriend.id];
    const h = cityTime(aiFriend.offset).getHours();
    const greet = h >= 21 || h < 6
      ? p.night[Math.floor(Math.random() * p.night.length)]
      : h < 10
        ? p.morning[Math.floor(Math.random() * p.morning.length)]
        : p.greet[Math.floor(Math.random() * p.greet.length)];
    aiMessages.push({ from: 'ai', text: greet, ts: Date.now() });
    ss(`ai_${aiFriend.id}`, aiMessages);
  }

  renderAIBody();
  document.getElementById('aiPanel').classList.add('open');
  setTimeout(() => {
    const b = document.getElementById('aiBody');
    b.scrollTop = b.scrollHeight;
    document.getElementById('aiInput').focus();
  }, 100);
}

function renderAIBody() {
  const f = aiFriend;
  const body = document.getElementById('aiBody');
  body.innerHTML = aiMessages.map(m => {
    const isMe = m.from === 'me';
    return `<div class="bubble-row ${isMe ? 'me' : ''}">
      ${!isMe ? `<div class="bubble-avatar" style="background:${f.color}22">${gs(`emotion_${f.id}`)?.emoji||'🤖'}</div>` : ''}
      <div>
        ${!isMe && !m.typing ? `<div class="bubble-time">${f.name}</div>` : ''}
        ${m.typing
          ? `<div class="typing-bubble"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div>`
          : `<div class="bubble ${isMe ? 'me' : 'them'}">${m.text}</div>`}
      </div>
    </div>`;
  }).join('');
  body.scrollTop = body.scrollHeight;
}

function getAIReply(text) {
  const p = AI_PERSONAS[aiFriend.id];
  const lower = text.toLowerCase();
  const sad = /힘들|슬퍼|우울|짜증|힘드|못하|모르겠|ㅠ|ㅜ|걱정/.test(lower);
  const happy = /좋아|행복|신나|최고|완료|했어|성공|잘|됐|ㅋㅋ/.test(lower);
  if (sad) return p.sad[Math.floor(Math.random() * p.sad.length)];
  if (happy) return p.positive[Math.floor(Math.random() * p.positive.length)];
  return p.casual[Math.floor(Math.random() * p.casual.length)];
}

function sendAI() {
  const input = document.getElementById('aiInput');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';

  aiMessages.push({ from: 'me', text, ts: Date.now() });
  aiMessages.push({ from: 'ai', typing: true, ts: Date.now() });
  renderAIBody();

  const delay = 800 + Math.random() * 1200;
  setTimeout(() => {
    aiMessages = aiMessages.filter(m => !m.typing);
    aiMessages.push({ from: 'ai', text: getAIReply(text), ts: Date.now() });
    ss(`ai_${aiFriend.id}`, aiMessages);
    renderAIBody();
  }, delay);
}

function handleKakaoUpload(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    const lines = e.target.result.split('\n').length;
    kakaoLoaded = true;
    document.getElementById('aiNotice').innerHTML =
      `✅ <strong>${file.name}</strong> 업로드 완료 (${lines.toLocaleString()}줄)<br>
       <span style="color:var(--sub)">${aiFriend.name}의 말투를 반영했어요</span>`;
    showToast(`📂 ${file.name} 학습 완료!`);
  };
  reader.readAsText(file, 'utf-8');
}
