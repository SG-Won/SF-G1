<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>감정 저니맵 데모</title>
<style>
  :root {
    --bg: #f6f7fb; --card: #fff; --text: #1f2433; --sub: #6b7280;
    --border: #e5e7eb; --me: #4f46e5; --friend: #f59e0b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    background: var(--bg); color: var(--text);
    padding: 20px 16px 40px; max-width: 700px; margin: 0 auto;
  }
  h2 { font-size: 16px; font-weight: 700; margin-bottom: 4px; }
  .subtitle { font-size: 12px; color: var(--sub); margin-bottom: 16px; }

  .legend {
    display: flex; gap: 16px; margin-bottom: 10px; font-size: 12px; font-weight: 600;
  }
  .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-right: 5px; }

  .chart-card {
    background: var(--card); border: 1px solid var(--border); border-radius: 16px;
    padding: 14px 12px 8px 8px; box-shadow: 0 2px 16px rgba(0,0,0,0.07);
    display: flex; gap: 6px; margin-bottom: 4px;
  }
  .y-labels {
    display: flex; flex-direction: column; justify-content: space-between;
    font-size: 9px; color: var(--sub); padding: 2px 0;
    min-width: 36px; text-align: right; line-height: 1.3;
  }
  .chart-wrap { flex: 1; }
  svg { display: block; width: 100%; overflow: visible; }
  .x-labels {
    display: flex; justify-content: space-between;
    padding: 4px 8px 0 52px; font-size: 10px; color: var(--sub);
    margin-bottom: 20px;
  }

  /* Timeline list */
  .tl-title { font-size: 13px; font-weight: 600; color: var(--sub); margin-bottom: 10px; }
  .event {
    display: flex; align-items: center; gap: 10px;
    background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; padding: 10px 12px; margin-bottom: 7px;
  }
  .ev-emoji { font-size: 22px; }
  .ev-info { flex: 1; }
  .ev-badge {
    font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 8px;
    display: inline-block; margin-bottom: 2px;
  }
  .badge-me { background: #ede9fe; color: #4f46e5; }
  .badge-friend { background: #fef3c7; color: #b45309; }
  .ev-text { font-size: 12px; color: var(--sub); }
  .ev-time { font-size: 11px; color: var(--sub); }

  /* Overlap note */
  .overlap-card {
    background: linear-gradient(135deg, #ede9fe, #fef3c7);
    border: 1px solid #c4b5fd44;
    border-radius: 12px;
    padding: 12px 14px;
    margin-bottom: 16px;
    font-size: 13px;
  }
  .overlap-card strong { display: block; margin-bottom: 3px; font-size: 14px; }
  .overlap-card span { font-size: 12px; color: var(--sub); }
</style>
</head>
<body>

<h2>🌡️ 오늘 감정 온도 흐름</h2>
<p class="subtitle">실제로 하루 종일 썼다면 이런 그래프가 생겨요</p>

<div class="legend">
  <span><span class="dot" style="background:#4f46e5"></span>나 (서울)</span>
  <span><span class="dot" style="background:#f59e0b"></span>지우 (베를린, -7h)</span>
</div>

<!-- Overlap notice -->
<div class="overlap-card">
  ✨ <strong>지금 둘 다 깨있어요!</strong>
  <span>오후 4–7시(서울) / 오전 9–12시(베를린) — 연락하기 딱 좋은 시간이에요</span>
</div>

<!-- Chart -->
<div class="chart-card">
  <div class="y-labels">
    <span>😄 최고</span>
    <span>😊 좋음</span>
    <span>😌 평온</span>
    <span>😔 힘듦</span>
    <span>😞 최저</span>
  </div>
  <div class="chart-wrap">
    <svg id="svg" viewBox="0 0 560 260" height="260" preserveAspectRatio="none"></svg>
  </div>
</div>
<div class="x-labels">
  <span>00:00</span><span>04:00</span><span>08:00</span>
  <span>12:00</span><span>16:00</span><span>20:00</span><span>24:00</span>
</div>

<!-- Event list -->
<div class="tl-title">📋 오늘 체크인 기록</div>

<script>
// 24h → pixel
const W = 560, H = 260, PT = 24, PB = 24, PL = 4, PR = 16;
const cW = W - PL - PR, cH = H - PT - PB;

function xOf(h) { return PL + (h / 24) * cW; }
function yOf(score) { return PT + cH - ((score - 1) / 9) * cH; }

// score 1–10
const ME_DATA = [
  { h: 6.5,  emoji: '😴', text: '자는 중이에요',   score: 4 },
  { h: 8.0,  emoji: '☀️', text: '좋은 아침!',      score: 8 },
  { h: 10.5, emoji: '📚', text: '수업 중이에요',    score: 5 },
  { h: 13.0, emoji: '🍜', text: '점심 먹는 중',     score: 7 },
  { h: 15.0, emoji: '😔', text: '과제가 너무 많아요', score: 3 },
  { h: 17.0, emoji: '🥰', text: '보고싶어요',       score: 8 },
  { h: 19.5, emoji: '😊', text: '저녁 먹고 행복',   score: 9 },
  { h: 22.0, emoji: '😌', text: '이제 쉬어요',      score: 6 },
];

const FRIEND_DATA = [
  { h: 1.0,  emoji: '🌙', text: '피곤해요',         score: 3 },
  { h: 3.0,  emoji: '😴', text: '자는 중이에요',    score: 4 },
  { h: 9.0,  emoji: '☀️', text: '좋은 아침! (베를린)', score: 8 },
  { h: 11.0, emoji: '🍜', text: '브런치 먹었어요',  score: 7 },
  { h: 13.5, emoji: '😊', text: '날씨 좋다 산책!',  score: 9 },
  { h: 16.0, emoji: '📚', text: '도서관 공부중',    score: 5 },
  { h: 18.5, emoji: '😤', text: '발표 망했어ㅠ',    score: 2 },
  { h: 21.0, emoji: '🥰', text: '너 생각났어',      score: 8 },
];

function buildPath(data) {
  if (data.length < 2) return '';
  let d = `M ${xOf(data[0].h)} ${yOf(data[0].score)}`;
  for (let i = 1; i < data.length; i++) {
    const cx = (xOf(data[i-1].h) + xOf(data[i].h)) / 2;
    d += ` C ${cx} ${yOf(data[i-1].score)} ${cx} ${yOf(data[i].score)} ${xOf(data[i].h)} ${yOf(data[i].score)}`;
  }
  return d;
}

function buildArea(data, color) {
  if (data.length < 1) return '';
  const bottom = PT + cH;
  let d = `M ${xOf(data[0].h)} ${bottom} L ${xOf(data[0].h)} ${yOf(data[0].score)}`;
  for (let i = 1; i < data.length; i++) {
    const cx = (xOf(data[i-1].h) + xOf(data[i].h)) / 2;
    d += ` C ${cx} ${yOf(data[i-1].score)} ${cx} ${yOf(data[i].score)} ${xOf(data[i].h)} ${yOf(data[i].score)}`;
  }
  d += ` L ${xOf(data[data.length-1].h)} ${bottom} Z`;
  return `<path d="${d}" fill="${color}" opacity="0.1"/>`;
}

function dots(data, color) {
  return data.map(p => `
    <circle cx="${xOf(p.h)}" cy="${yOf(p.score)}" r="5" fill="${color}" stroke="white" stroke-width="2"/>
    <text x="${xOf(p.h)}" y="${yOf(p.score)-10}" text-anchor="middle" font-size="15">${p.emoji}</text>
  `).join('');
}

// Grid
let grid = '';
for (let i = 1; i <= 4; i++) {
  const y = PT + (i/5) * cH;
  grid += `<line x1="${PL}" y1="${y}" x2="${W-PR}" y2="${y}" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="4,4"/>`;
}

// Overlap highlight (16–19h)
const ox1 = xOf(16), ox2 = xOf(19);
const overlapRect = `<rect x="${ox1}" y="${PT}" width="${ox2-ox1}" height="${cH}" fill="#a78bfa" opacity="0.08" rx="4"/>`;

const svg = document.getElementById('svg');
svg.innerHTML = `
  ${grid}
  ${overlapRect}
  ${buildArea(ME_DATA, '#4f46e5')}
  ${buildArea(FRIEND_DATA, '#f59e0b')}
  <path d="${buildPath(ME_DATA)}" fill="none" stroke="#4f46e5" stroke-width="2.5" stroke-linecap="round"/>
  <path d="${buildPath(FRIEND_DATA)}" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="7,3"/>
  ${dots(ME_DATA, '#4f46e5')}
  ${dots(FRIEND_DATA, '#f59e0b')}
  <rect x="${ox1}" y="${PT-2}" width="${ox2-ox1}" height="6" rx="3" fill="#a78bfa" opacity="0.5"/>
`;

// Event list
const all = [
  ...ME_DATA.map(d => ({ ...d, who: 'me' })),
  ...FRIEND_DATA.map(d => ({ ...d, who: 'friend' })),
].sort((a, b) => b.h - a.h);

const listEl = document.querySelector('.tl-title').nextElementSibling;
const listHTML = all.map(e => {
  const hh = String(Math.floor(e.h)).padStart(2,'0');
  const mm = String(Math.round((e.h % 1) * 60)).padStart(2,'0');
  const isMe = e.who === 'me';
  return `
    <div class="event">
      <span class="ev-emoji">${e.emoji}</span>
      <div class="ev-info">
        <span class="ev-badge ${isMe ? 'badge-me' : 'badge-friend'}">${isMe ? '나 (서울)' : '지우 (베를린)'}</span>
        <div class="ev-text">${e.text}</div>
      </div>
      <span class="ev-time">${hh}:${mm}</span>
    </div>`;
}).join('');

document.body.insertAdjacentHTML('beforeend', listHTML);
</script>
</body>
</html>
